; e-serde canonical sample — INI: flat string sections only (no nesting, no types).
; Every value decodes as str; this is a documented per-format limitation, not a bug.

[meta]
project = e-serde
stage = bench
revision = 7

[settings]
region = eu-west-1
log_level = info
drain_sec = 30

[types]
string = plain
empty_string =
int = -42
float = 3.5
bool = true
numeric_string = 123
boolean_string = true
octal_string = 0755
date_like = 2024-01-15
unicode = Málaga ñ 日本語 ✓

[entry.svc-000000]
name = worker-0
role = admin
enabled = false

[entry.svc-000001]
name = worker-1
role = editor
enabled = true

[entry.svc-000002]
name = worker-2
role = viewer
enabled = true
