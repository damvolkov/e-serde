[database]
host = localhost
port = 5432
username = admin
password = secret

[api]
timeout = 30
retries = 3
endpoint = https://api.example.com/v1

[features]
auth_enabled = true
logging_enabled = true
monitoring_enabled = false

[logging]
level = info
file = /var/log/app.log
max_size = 100MB

[cache]
type = redis
host = localhost
port = 6379
timeout = 5