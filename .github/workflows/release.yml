name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when tag is set)
        type: choice
        default: patch
        options: [patch, minor, major]
      tag:
        description: Republish an existing v* tag verbatim (empty = cut a new version)
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Version + tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: false
      - name: Configure git identity and push credentials
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$RELEASE_PAT" | base64 -w0)"
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.tag }}
        run: |
          if [ -n "$GIVEN" ]; then echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            IFS=. read -r M m p <<< "$(git describe --tags --abbrev=0 | sed 's/^v//')"
            case "$BUMP" in
              major) M=$((M+1)); m=0; p=0 ;;
              minor) m=$((m+1)); p=0 ;;
              *) p=$((p+1)) ;;
            esac
          else
            read -r M m p <<< "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | tr . ' ')"
          fi
          echo "tag=v$M.$m.$p" >> "$GITHUB_OUTPUT"
      - name: Sync Cargo/uv and commit
        if: inputs.tag == ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          sed -i "0,/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/s//version = \"${TAG#v}\"/" Cargo.toml
          cargo update --workspace
          uv lock
          git add Cargo.toml Cargo.lock uv.lock
          git commit -m "chore(release): $TAG"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --latest --verify-tag --generate-notes || gh release edit "$TAG" --latest=true

  wheels:
    name: wheels (${{ matrix.os }}/${{ matrix.target }})
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7  # v2.9.2
      - uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.14
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.15.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7  # v2.9.2
      - uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38  # v1.51.0
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.15.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [bump, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e-serde/${{ needs.bump.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
