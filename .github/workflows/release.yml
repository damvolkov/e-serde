name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Bump PR + tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # release-plz pushes with its own token; checkout must not persist the default one.
          persist-credentials: false
      - name: Generate release pull request (merge it to tag v0.1.1, v0.2.0, ...)
        uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc  # v0.5.137
        with:
          command: release
        env:
          # With the PAT secret, the merge cascades the v* tag into publish.yml.
          # Without it, the fallback still opens the bump PR, tags and releases;
          # the tag push just won't trigger workflows (GitHub limitation) — publish
          # it manually from Actions if that happens.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
