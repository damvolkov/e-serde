name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when tag is set)
        type: choice
        default: patch
        options: [patch, minor, major]
      tag:
        description: Republish an existing v* tag verbatim (empty = cut a new version)
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Version + tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Configure git identity and push credentials
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config push.followTagsToPush false
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$RELEASE_PAT" | base64 -w0)"
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.tag }}
        run: |
          if [ -n "$GIVEN" ]; then echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"; exit 0; fi
          LATEST=$(git ls-remote --tags origin 'refs/tags/v*' | sed -E 's#.*/v##; s/\^\{\}$//' | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            IFS=. read -r M m p <<< "$LATEST"
            case "$BUMP" in
              major) M=$((M+1)); m=0; p=0 ;;
              minor) m=$((m+1)); p=0 ;;
              *) p=$((p+1)) ;;
            esac
          else
            read -r M m p <<< "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | tr . ' ')"
          fi
          echo "tag=v$M.$m.$p" >> "$GITHUB_OUTPUT"
      - name: Sync Cargo/uv, open release PR, tag once merged
        if: inputs.tag == ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/release-${TAG#v}"
          sed -i "0,/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/s//version = \"${TAG#v}\"/" Cargo.toml
          cargo update --workspace
          uv lock
          PREV=$(git ls-remote --tags origin 'refs/tags/v*' | sed -E 's#.*/v##; s/\^\{\}$//' | sort -V | grep -vx "${TAG#v}" | tail -1)
          RANGE=${PREV:+v$PREV..HEAD}
          { printf '## [%s] — %s\n\n' "${TAG#v}" "$(date -u +%Y-%m-%d)"; git log --no-merges --pretty='- %s' $RANGE | grep -vE '^- chore\(release\)' | sed '/^-$/d'; printf '\n'; } > /tmp/entry.md
          awk 'NR==1{print;next} /^## \[/{if(!done){while((getline l<"/tmp/entry.md"))print l;done=1}print;next}{print}' CHANGELOG.md > /tmp/changelog.md && mv /tmp/changelog.md CHANGELOG.md
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock uv.lock CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git push -f origin "$BRANCH"
          PR=$(gh pr create -B main -H "$BRANCH" --title "chore(release): $TAG" --body "Automated release bump. Squash-merges itself once CI is green." 2>/dev/null | tail -n1 | awk -F/ '{print $NF}')
          PR=${PR:-$(gh pr view "$BRANCH" --json number -q .number)}
          [ -n "$PR" ] || { echo "::error::could not open or find the release PR" >&2; exit 1; }
          gh pr merge --auto --squash "$PR"
          MERGED=""
          for i in $(seq 1 120); do
            MERGED=$(gh pr view "$PR" --json mergedAt -q .mergedAt)
            [ -n "$MERGED" ] && [ "$MERGED" != "null" ] && break
            sleep 10
          done
          [ -n "$MERGED" ] && [ "$MERGED" != "null" ] || { echo "::error::release PR #$PR did not merge within 20 minutes" >&2; exit 1; }
          SHA=$(gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)
          [ -n "$SHA" ] && [ "$SHA" != "null" ] || { echo "::error::PR #$PR merged without a merge commit" >&2; exit 1; }
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --latest --verify-tag --notes-file <(awk -v s="## [${TAG#v}]" 'index($0,s)==1{p=1} p && /^## \[/ && index($0,s)!=1{exit} p' CHANGELOG.md) || gh release edit "$TAG" --latest=true

  wheels:
    name: wheels (${{ matrix.os }}/${{ matrix.target }})
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.14
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.15.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.15.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [bump, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e-serde/${{ needs.bump.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
