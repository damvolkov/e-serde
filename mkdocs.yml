site_name: e-serde
site_description: Fast, type-safe structured-data loading for Python on native Rust codecs.
site_url: https://damvolkov.github.io/e-serde/
repo_name: damvolkov/e-serde
repo_url: https://github.com/damvolkov/e-serde
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 damvolkov

theme:
  name: material
  logo: assets/eserde.svg
  favicon: assets/eserde.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Light mode }
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.share

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/damvolkov

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true, line_spans: __span }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Introduction: introduction.md
      - Installation: installation.md
      - Usage: usage.md
  - Reference: reference.md
  - Benchmarks: benchmarks.md
  - Development: development.md
