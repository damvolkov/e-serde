[workspace]
resolver = "3"
members = ["crates/native"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/damvolkov/e-serde"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# 0.1.0 regressed YAML spec null semantics (empty node resolves to "" not null);
# pinned until upstream fixes it — test_standards re-verifies claims on every bump.
saphyr = "=0.0.12"
saphyr-parser = "=0.0.12"
toml = { version = "1.1", features = ["preserve_order"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
rust-ini = "0.21"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
