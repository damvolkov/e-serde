[build-system]
requires = ["maturin>=1.10"]
build-backend = "maturin"

[project]
name = "e-serde"
dynamic = ["version"]
description = "Fast, type-safe structured data loader: native Rust codecs with pluggable backends."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack", "config", "yaml", "toml", "jsonc", "ini", "msgspec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.21",
]

[project.urls]
Homepage = "https://github.com/damvolkov/e-serde"
Source = "https://github.com/damvolkov/e-serde"
Issues = "https://github.com/damvolkov/e-serde/issues"
Changelog = "https://github.com/damvolkov/e-serde/blob/main/CHANGELOG.md"

[project.scripts]
e-serde = "eserde.main:main"

[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.30",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-mock>=3.15",
    "inline-snapshot>=0.30",
    "dirty-equals>=0.11",
    "hypothesis>=6.150",
]
build = [
    "maturin>=1.10",
]
docs = [
    "mkdocs-material>=9.7",
]
bench = [
    "pytest-benchmark>=5.3",
    "matplotlib>=3.11",
    "pydantic>=2.13",
    "orjson>=3.12",
    "ujson>=6.0",
    "simplejson>=4.1",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.19",
    "json5>=0.15",
    "pyjson5>=2.0",
    "rtoml>=0.13",
    "tomli>=2.4",
    "tomli-w>=1.2",
    "tomlkit>=0.15",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "bench" },
    { include-group = "docs" },
    "prek>=0.4",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { git = { commit = true, tags = true } }]

[tool.maturin]
manifest-path = "crates/native/Cargo.toml"
module-name = "eserde._native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT"]
"tests/benchmark/report.py" = ["RUF001"]  # "×3.2" ratio labels are typography, not lookalike abuse

[tool.ruff.lint.isort]
known-first-party = ["eserde", "tests"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format", "type"]  # `format=`/`type=` are the intentional keyword-only public API

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not bench"]
pythonpath = ["."]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "bench: rival benchmark matrix (run via make bench)",
]

[tool.coverage.run]
source_pkgs = ["eserde"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
